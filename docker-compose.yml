# Capsule prototype: MQTT bus, plant (mock or KSP gateway), cockpit logic, virtual panel.
#   ./capsule start            # everything, KSP as the plant (kRPC 127.0.0.1:50000)
#   ./capsule start mock       # the mock plant instead
#   ./capsule stop             # (by hand: docker compose --profile ksp up -d --build, or --profile mock)
# Panel: http://localhost:8650   Broker: mqtt://localhost:1883, ws://localhost:9001
services:
  broker:
    image: eclipse-mosquitto:2.0.20
    ports: ["1883:1883", "9001:9001"]
    volumes: ["./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
    restart: unless-stopped

  cockpit:
    build: ./cockpit-logic
    environment: { MQTT_HOST: broker }
    depends_on: [broker]
    restart: unless-stopped

  plant-mock:
    profiles: [mock]
    build: ./plant-mock
    environment: { MQTT_HOST: broker }
    depends_on: [broker]
    restart: unless-stopped

  gateway-ksp:
    profiles: [ksp]
    build: ./gateway-ksp
    network_mode: host          # kRPC listens on 127.0.0.1 only
    environment: { MQTT_HOST: 127.0.0.1, KRPC_HOST: 127.0.0.1 }
    restart: unless-stopped

  flight-dynamics:
    build: ./flight-dynamics
    environment: { MQTT_HOST: broker }
    depends_on: [broker]
    restart: unless-stopped

  mcc-data:                     # Mission Control's flight recorder, the bodies and their relief maps (mcc-data/)
    build: ./mcc-data
    network_mode: host          # kRPC listens on 127.0.0.1 only
    environment: { MQTT_HOST: 127.0.0.1, KRPC_HOST: 127.0.0.1, MAPS_DIR: /maps, STATE_FILE: /state/flight.json }
    user: "${UID:-1000}:${GID:-1000}"       # the maps belong to you, not root
    volumes:
      - ./panels/virtual/maps:/maps       # served to the pages as maps/
      - ./mcc-data/state:/state           # the flight so far, kept across a restart
    restart: unless-stopped

  simsup:
    build: ./simsup
    environment: { MQTT_HOST: broker, PANELS_DIR: /panels }
    volumes:
      - ./protocol/panels:/panels:ro
    depends_on: [broker]
    restart: unless-stopped

  panel:
    image: nginx:1.27-alpine
    ports: ["8650:80"]
    volumes:
      - ./panels/virtual:/srv/panel:ro
      - ./protocol/panels:/srv/panels:ro
      - ./panels/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./panels/auth:/etc/nginx/auth:ro       # SimSup's password (panels/auth/README.md)
    extra_hosts: ["host.docker.internal:host-gateway"]     # JRTI's camera server, proxied as /jrti/
    restart: unless-stopped
