; Generic panel module firmware, one build per module: `pio run -e eng`, `pio run -e eng -t upload`.
; The module's tables come from generated/<module>/module_config.h (tools/gen_module.py, which also writes
; modules.ini, the list of environments below). Set the broker with MQTT_HOST.
[platformio]
extra_configs = modules.ini

[module]
platform = espressif32@6.7.0
framework = arduino
; the ESP32-POE's variant: Ethernet (LAN8720) on its pins. The POE2 is the same Ethernet with a WROVER module: check
board = esp32-poe
monitor_speed = 115200
lib_deps =
    256dpi/MQTT@^2.5.2
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit LED Backpack Library@^1.5.1
    adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
    -D MQTT_HOST=\"192.168.1.10\"
