server {
  listen 80;
  absolute_redirect off;          # relative redirects: the browser keeps the port it came on (8650)
  root /srv/panel;
  location /panels/ { alias /srv/panels/; add_header Cache-Control no-store; }
  # The JRTI mod's camera server (KSP on this host, port 8080): through here the camera pages fetch its camera list
  # from their own origin (JRTI sends no CORS header), and a kiosk on another machine needs to reach this server only.
  location /jrti/ {
    proxy_pass http://host.docker.internal:8080/;
    proxy_buffering off;                  # MJPEG: every frame as it comes
    proxy_read_timeout 1h;
    add_header Cache-Control no-store;
  }
  # The instructor station: a password (panels/auth/simsup.htpasswd, not in git; see panels/auth/README.md)
  location ~ ^/simsup\.(html|js|css)$ {
    auth_basic "SimSup";
    auth_basic_user_file /etc/nginx/auth/simsup.htpasswd;
    add_header Cache-Control no-cache;
  }
  # The site's front page is the probe room, the one station always open; the console was index.html before
  location = / { return 302 /probe.html$is_args$args; }
  location = /index.html { return 301 /console.html$is_args$args; }
  location / { add_header Cache-Control no-cache; try_files $uri $uri/ =404; }
}
