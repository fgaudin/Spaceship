<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsule · camera monitor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="fdai.css">
<link rel="stylesheet" href="cam.css">
</head>
<body>
<header class="topbar" data-subtitle="camera monitor · glass panel">
  <div class="links"><span id="source">kerbcast: ?</span></div>
</header>

<main class="cam-wrap">
  <section class="plate cam-plate" aria-label="Camera monitor">
    <span class="plate-title">MONITOR</span>
    <div class="cam-screen">
      <video id="video" autoplay muted playsinline></video>
      <div id="caption" class="cam-caption"></div>
      <div id="flag" class="flag">NO SIGNAL</div>
    </div>
    <p class="fdai-note">A display only. The camera is chosen on the CAMERA panel (CAM ◂ ▸), which publishes
      <code>cam/select</code>; this page publishes the cameras it can show on <code>cam/list</code>.
      The picture comes from the Kerbcast mod in KSP.</p>
  </section>
</main>

<script src="vendor/mqtt.min.js"></script>
<script type="module" src="shell.js"></script>
<script type="module" src="cam.js"></script>
</body>
