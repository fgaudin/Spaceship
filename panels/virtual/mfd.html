<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsule · MFD</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="fdai.css">
<link rel="stylesheet" href="mfd.css">
</head>
<body>
<header class="topbar">
  <div class="brand">CAPSULE <span>MFD · glass panel</span></div>
  <div class="conn"><span id="conn-dot" class="dot"></span><span id="conn-text">connecting…</span></div>
  <nav class="nav" aria-label="Panels">
    <a class="navlink" href="index.html">ENG</a><a class="navlink" href="index.html?panel=sys">SYS</a>
    <a class="navlink" href="index.html?panel=cmp">CMP</a><a class="navlink" href="index.html?panel=rdv">RDV</a>
    <a class="navlink" href="index.html?panel=dsky">DSKY</a><a class="navlink" href="fdai.html">FDAI</a>
    <a class="navlink" href="mfd.html" aria-current="page">MFD</a>
  </nav>
  <div class="links"><span id="plant">plant: ?</span></div>
</header>

<main class="fdai-wrap">
  <section class="plate mfd-plate" aria-label="Multi-function display">
    <span class="plate-title">MFD</span>
    <div class="mfd-row">
      <div class="bezel-col" role="group" aria-label="Pages">
        <button type="button" data-page="orbit">ORBIT</button>
        <button type="button" data-page="ascent">ASCENT</button>
        <button type="button" data-page="landing">LANDING</button>
        <button type="button" data-page="docking">DOCKING</button>
      </div>
      <div class="screen">
        <canvas id="mfd" width="640" height="640" role="img" aria-label="MFD page"></canvas>
      </div>
      <div class="bezel-col" role="group" aria-label="Scale">
        <button type="button" id="k-zoom-in">ZOOM +</button>
        <button type="button" id="k-zoom-out">ZOOM −</button>
        <span class="bz-note" id="zoom-note">×1</span>
      </div>
    </div>
    <p class="fdai-note">Reads <code>tlm/flight</code>, <code>tlm/orbit</code>, <code>tlm/vessel</code>, <code>tlm/attitude</code>,
      <code>tlm/target</code>. Keys: <kbd>1</kbd>–<kbd>4</kbd> pages, <kbd>+</kbd>/<kbd>−</kbd> zoom. <code>?demo=1</code> runs without a broker.</p>
  </section>
</main>

<script src="vendor/mqtt.min.js"></script>
<script src="mfd.js"></script>
</body>
</html>
