<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsule · FDAI</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="fdai.css">
</head>
<body>
<header class="topbar" data-subtitle="FDAI · glass panel">
  <div class="links"><span id="plant">plant: ?</span></div>
</header>

<main class="fdai-wrap">
  <section class="plate fdai-plate" aria-label="Flight director attitude indicator">
    <span class="plate-title">FDAI</span>
    <div class="fdai-box">
      <canvas id="ball" width="560" height="560" role="img" aria-label="Attitude ball"></canvas>
      <div id="flag" class="flag" hidden>NO ATT</div>
    </div>
    <div class="readouts" aria-live="off">
      <div><span>PITCH</span><b id="r-pitch">---.-</b></div>
      <div><span>HDG</span><b id="r-hdg">---.-</b></div>
      <div><span>ROLL</span><b id="r-roll">---.-</b></div>
    </div>
    <p class="fdai-note">Reads <code>tlm/attitude</code>. Yellow needles: error to the selected reference (centred = on attitude).
      Outer scales: body rates. Needles, scales and markers: the FDAI controls on the ATTITUDE panel.</p>
  </section>
</main>

<script src="vendor/mqtt.min.js"></script>
<script type="module" src="shell.js"></script>
<script type="module" src="fdai.js"></script>
</body>
</html>
